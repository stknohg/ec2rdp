name: Build and Test

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '**.yaml'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Currently, this app only supports Windows and MacOS.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "~1.27.3"
          cache: true
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
